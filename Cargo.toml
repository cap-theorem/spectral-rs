[package]
name = "spectral-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Rust client for the Spectral sidecar"
repository = "https://github.com/cap-theorem/spectral-rs"
readme = "README.md"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["json"] }

[dev-dependencies]
tiny_http = "0.12.0"
